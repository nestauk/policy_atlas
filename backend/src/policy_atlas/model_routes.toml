# Which AI model each part of the app uses.
#
# This file is the only place model names live. The code asks for a model by
# step name (for example "screen" or "synthesis"); this file says which model
# that step gets on the selected route. Pick a route with the environment
# variable POLICY_ATLAS_MODEL_ROUTE. When it is unset, "openai-direct" is used,
# which is exactly what the app did before this file existed.
#
# Three layers:
#   [steps]            every step, once, with its default tier
#   [routes.<name>]    the model for each tier, provider knobs, embeddings,
#                      and the search-queries backend
#   [routes.<name>.steps]  optional: a step that should not follow its default
#                      tier on this route (a tier name, or a specific model id)
#
# To try models without editing this file, point POLICY_ATLAS_MODEL_ROUTE_FILE
# at a second file with its own [routes.*] tables; they replace or add routes
# by name. [steps] always comes from this file.
#
# Design: docs/tasks/045-bedrock-local-route/contract.md (D3) and ADR 0039.

[steps]
# Cheap, high-volume steps. "mini" is the older cheap model; "fast" is the
# newer one that task 051 measured screening and query generation on.
screen = "fast"
search_queries = "fast"
search_reformulate = "fast"
search_suggest = "fast"
classify = "mini"
extract = "mini"
icf_extract = "mini"
finding_vetter = "mini"
icf_finding_vetter = "mini"
relevance = "mini"
rerank = "mini"
theme_discovery = "mini"
theme_assignment = "mini"
group_clustering = "mini"
grounding_judge = "mini"
mrs_note = "mini"
full_report_intro = "mini"
agent_triage = "mini"
# Writing and conversation.
synthesis = "standard"
case_studies = "standard"
chat = "standard"
# Planning and the agent's routing decisions.
planner = "frontier"
agent = "frontier"

# ---------------------------------------------------------------------------
[routes.openai-direct]
# Today's behaviour: OpenAI called directly. The default when nothing is set.
openai_base_url = "https://api.openai.com/v1"   # stated so no stray env var can move it
api_key_env = "OPENAI_API_KEY"                  # which variable holds this route's key

[routes.openai-direct.text]
mini = "gpt-5.4-mini"
fast = "gpt-5.6-luna"
standard = "gpt-5.6-terra"
frontier = "gpt-5.5"

[routes.openai-direct.knobs.reasoning_effort]
# Terra refuses function tools unless reasoning effort is "none" (task 029).
"gpt-5.6-terra" = "none"

[routes.openai-direct.embeddings]
backend = "openai"
model = "text-embedding-3-small"
profile = "openai_text_embedding_3_small_v1"

[routes.openai-direct.search_queries]
backend = "openai"

# ---------------------------------------------------------------------------
[routes.bedrock-local]
# Every call goes to Amazon Bedrock's London endpoint. OpenAI models are reached
# through Bedrock's global routing (the only way from London); embeddings use
# Cohere through EU-only routing. gpt-5.4-mini and gpt-5.5 do not exist on
# Bedrock, so Luna and Terra stand in for them (contract § Why now).
openai_base_url = "https://bedrock-runtime.eu-west-2.amazonaws.com/openai/v1"
api_key_env = "AWS_BEARER_TOKEN_BEDROCK"       # the Bedrock key; boto3 reads the same variable

[routes.bedrock-local.text]
mini = "global.openai.gpt-5.6-luna"
fast = "global.openai.gpt-5.6-luna"
standard = "global.openai.gpt-5.6-terra"
frontier = "global.openai.gpt-5.6-terra"   # owner's choice (O1); Sol is the step-up

[routes.bedrock-local.knobs.reasoning_effort]
"global.openai.gpt-5.6-terra" = "none"

[routes.bedrock-local.embeddings]
backend = "cohere"
model = "eu.cohere.embed-v4:0"
profile = "cohere_embed_v4_1536_v1"

[routes.bedrock-local.search_queries]
backend = "openai"

# ---------------------------------------------------------------------------
[routes.bedrock-local-claude]
# As bedrock-local, but search query generation runs on Claude via Bedrock.
# Swap the Claude tier by changing the model below:
#   eu.anthropic.claude-sonnet-5  /  eu.anthropic.claude-opus-5
openai_base_url = "https://bedrock-runtime.eu-west-2.amazonaws.com/openai/v1"
api_key_env = "AWS_BEARER_TOKEN_BEDROCK"

[routes.bedrock-local-claude.text]
mini = "global.openai.gpt-5.6-luna"
fast = "global.openai.gpt-5.6-luna"
standard = "global.openai.gpt-5.6-terra"
frontier = "global.openai.gpt-5.6-terra"

[routes.bedrock-local-claude.knobs.reasoning_effort]
"global.openai.gpt-5.6-terra" = "none"

[routes.bedrock-local-claude.embeddings]
backend = "cohere"
model = "eu.cohere.embed-v4:0"
profile = "cohere_embed_v4_1536_v1"

[routes.bedrock-local-claude.search_queries]
backend = "claude"
model = "eu.anthropic.claude-haiku-4-5-20251001-v1:0"
