# Which AI model each part of the app uses, and how hard it thinks.
#
# This file is the only place model names live. The code asks for a model by
# step name; one step is one named model call site (for example
# "classify_document" or "synthesise_section_turn"). This file says which model
# that step gets on the selected route and which reasoning effort it sends.
# Pick a route with the environment variable POLICY_ATLAS_MODEL_ROUTE. When it
# is unset, "openai-direct" is used: OpenAI called directly.
#
# Three layers:
#   [steps]            every step, once: its default tier and its reasoning
#                      effort ("none", "low", "medium", "high" or "xhigh";
#                      "none" means the model does not think before answering)
#   [routes.<name>]    the model for each tier, embeddings, and the
#                      search-queries backend
#   [routes.<name>.steps]  optional: a step that should not follow its default
#                      on this route. A bare string is a tier name or a model
#                      id. A table may carry `model` (tier name or model id)
#                      and/or `reasoning_effort`.
#
# Reasoning effort is per step (task 056, D4). "medium" is the provider's own
# default, written out so every step says what it sends. Terra-class models
# refuse function tools unless the effort is "none", so the tool-bearing
# writer and chat steps carry "none". Sol-class models refuse "none"; their
# lowest accepted value is "low".
#
# To try models without editing this file, point an env variable
# POLICY_ATLAS_MODEL_ROUTE_FILE at a second file with its own [routes.*] tables;
# they replace or add routes by name. [steps] always comes from this file.
#
# Design: docs/tasks/053-bedrock-local-route/contract.md (D3), ADR 0041, and
# docs/tasks/056-cost-latency/contract.md (D2, D4, D9), ADR 0042.

[steps]
# --- Evidence search: assess ---------------------------------------------
classify_document = { tier = "fast", reasoning_effort = "high" }
screen_abstract = { tier = "fast", reasoning_effort = "medium" }
screen_full = { tier = "fast", reasoning_effort = "medium" }
# --- Evidence search: corpus, group ---------------------------------------
select_rerank = { tier = "fast", reasoning_effort = "medium" }
characterise_discover = { tier = "fast", reasoning_effort = "medium" }
characterise_assign = { tier = "fast", reasoning_effort = "medium" }
group_discover = { tier = "fast", reasoning_effort = "medium" }
group_assign = { tier = "fast", reasoning_effort = "medium" }
# --- Evidence search: extract ----------------------------------------------
extract_iof_findings = { tier = "fast", reasoning_effort = "medium" }
extract_icf_findings = { tier = "fast", reasoning_effort = "medium" }
extract_interventions = { tier = "fast", reasoning_effort = "medium" }
extract_vet_iof_findings = { tier = "fast", reasoning_effort = "high" }
extract_vet_icf_findings = { tier = "fast", reasoning_effort = "high" }
extract_annotate_relevance = { tier = "fast", reasoning_effort = "high" }
# --- Evidence search: search ------------------------------------------------
search_generate_queries = { tier = "fast", reasoning_effort = "medium" }
search_reformulate = { tier = "fast", reasoning_effort = "medium" }
search_suggest = { tier = "fast", reasoning_effort = "medium" }
search_queries_v2_openalex = { tier = "fast", reasoning_effort = "medium" }
search_queries_v2_overton = { tier = "fast", reasoning_effort = "medium" }
search_reformulate_v2_openalex = { tier = "fast", reasoning_effort = "medium" }
search_reformulate_v2_overton = { tier = "fast", reasoning_effort = "medium" }
# --- Evidence search: synthesise (the writer; Terra needs "none" for tools) --
synthesise_propose_sections = { tier = "standard", reasoning_effort = "none" }
synthesise_write_block_summary = { tier = "standard", reasoning_effort = "none" }
synthesise_write_artefact_summary = { tier = "standard", reasoning_effort = "none" }
synthesise_judge_summary = { tier = "standard", reasoning_effort = "none" }
synthesise_section_turn = { tier = "standard", reasoning_effort = "none" }   # section turns and the repair share this step (D10)
synthesise_write_key_findings = { tier = "standard", reasoning_effort = "none" }
synthesise_write_case_studies = { tier = "standard", reasoning_effort = "none" }
synthesise_write_source_note = { tier = "fast", reasoning_effort = "medium" }
synthesise_write_intro = { tier = "fast", reasoning_effort = "medium" }
judge_grounding = { tier = "fast", reasoning_effort = "medium" }
# --- Conversation and agents -----------------------------------------------
chat = { tier = "standard", reasoning_effort = "none" }   # the tool turn, the prose stream and the final parse share this step
agent_route = { tier = "standard", reasoning_effort = "medium" }
agent_triage = { tier = "fast", reasoning_effort = "medium" }
agent_decide = { tier = "standard", reasoning_effort = "medium" }
agent_gate_sort = { tier = "fast", reasoning_effort = "medium" }
agent_longlist_sort = { tier = "fast", reasoning_effort = "medium" }
agent_option_design = { tier = "standard", reasoning_effort = "medium" }
agent_suggest = { tier = "standard", reasoning_effort = "medium" }
task_agent_turn = { tier = "standard", reasoning_effort = "medium" }
# --- Options scoping (the judgment calls run on the strongest tier) ----------
task_agent_scoping_turn = { tier = "frontier", reasoning_effort = "medium" }
longlist_discover = { tier = "frontier", reasoning_effort = "medium" }
longlist_assign = { tier = "fast", reasoning_effort = "medium" }
longlist_themes = { tier = "frontier", reasoning_effort = "medium" }
longlist_assign_themes = { tier = "frontier", reasoning_effort = "medium" }
longlist_type = { tier = "frontier", reasoning_effort = "medium" }
longlist_constrain = { tier = "frontier", reasoning_effort = "medium" }
longlist_distinct = { tier = "frontier", reasoning_effort = "medium" }
longlist_authority = { tier = "frontier", reasoning_effort = "medium" }
longlist_shortlist = { tier = "frontier", reasoning_effort = "medium" }
option_profile_line = { tier = "frontier", reasoning_effort = "medium" }
option_profile_potential_impact = { tier = "frontier", reasoning_effort = "medium" }
option_profile_ambition = { tier = "frontier", reasoning_effort = "medium" }
option_profile_setting = { tier = "frontier", reasoning_effort = "medium" }
option_profile_fold = { tier = "fast", reasoning_effort = "medium" }
option_profile_place_sentences = { tier = "fast", reasoning_effort = "medium" }

# ---------------------------------------------------------------------------
[routes.openai-direct]
# OpenAI called directly. The default when nothing is set.
openai_base_url = "https://api.openai.com/v1"   # stated so no stray env var can move it
api_key_env = "OPENAI_API_KEY"                  # which variable holds this route's key

[routes.openai-direct.text]
fast = "gpt-5.6-luna"
standard = "gpt-5.6-terra"
frontier = "gpt-5.6-sol"

[routes.openai-direct.embeddings]
backend = "openai"
model = "text-embedding-3-small"
profile = "openai_text_embedding_3_small_v1"

[routes.openai-direct.search_queries]
# Which code path writes the search queries (the one step with two
# implementations). "openai": the OpenAI client, on the step's tier like every
# other step. "claude": Claude through boto3 (Claude does not accept the OpenAI
# request format), which needs a model line beside it.
backend = "openai"

# ---------------------------------------------------------------------------
[routes.bedrock]
# Every call goes to Amazon Bedrock's London endpoint. OpenAI models are reached
# through Bedrock's global routing (the only way from London); embeddings use
# Cohere through EU-only routing. The same three models as openai-direct, under
# Bedrock's global profile names.
openai_base_url = "https://bedrock-runtime.eu-west-2.amazonaws.com/openai/v1"
api_key_env = "AWS_BEARER_TOKEN_BEDROCK"       # the Bedrock key; boto3 reads the same variable

[routes.bedrock.text]
fast = "global.openai.gpt-5.6-luna"
standard = "global.openai.gpt-5.6-terra"
frontier = "global.openai.gpt-5.6-sol"

[routes.bedrock.embeddings]
backend = "cohere"
model = "eu.cohere.embed-v4:0"
profile = "cohere_embed_v4_1536_v1"

[routes.bedrock.search_queries]
backend = "openai"   # Luna through Bedrock's OpenAI-format address, like every other step

# ---------------------------------------------------------------------------
[routes.bedrock-claude]
# NOT IN USE. Kept for testing Claude models later (owner, 2026-10-22): as
# bedrock, but search query generation runs on Claude via Bedrock. No
# environment selects it and nothing is planned to. Swap the Claude tier by
# changing the model below:
#   eu.anthropic.claude-sonnet-5  /  eu.anthropic.claude-opus-5
openai_base_url = "https://bedrock-runtime.eu-west-2.amazonaws.com/openai/v1"
api_key_env = "AWS_BEARER_TOKEN_BEDROCK"

[routes.bedrock-claude.text]
fast = "global.openai.gpt-5.6-luna"
standard = "global.openai.gpt-5.6-terra"
frontier = "global.openai.gpt-5.6-sol"

[routes.bedrock-claude.embeddings]
backend = "cohere"
model = "eu.cohere.embed-v4:0"
profile = "cohere_embed_v4_1536_v1"

[routes.bedrock-claude.search_queries]
backend = "claude"
model = "eu.anthropic.claude-haiku-4-5-20251001-v1:0"
