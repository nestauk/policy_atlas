# Trusted web publishers (task 054, contract C23): a web page from one of these
# hosts counts by its appraisal score, like a paper. Any other web page counts
# only toward "weak". A host matches itself and every subdomain ("gov.uk" also
# matches "ons.gov.uk"). Edit this list, not the code.
