# Harness-only model route for the task 054 search eval (owner request 2026-10-27):
# screen on gpt-6-luna; classify, rerank, judge, planner and web search on gpt-6.1-terra.
# Loaded through POLICY_ATLAS_MODEL_ROUTE_FILE by _route.py; the product route is unchanged.

[routes.eval-6x]
openai_base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[routes.eval-6x.text]
fast = "gpt-6-luna"
standard = "gpt-6.1-terra"
frontier = "gpt-6.1-terra"

[routes.eval-6x.steps]
classify = "standard"
rerank = "standard"

[routes.eval-6x.knobs.reasoning_effort]
# The same setting the 5.6 route gives Terra, so the two runs differ only by model.
"gpt-6.1-terra" = "none"

[routes.eval-6x.embeddings]
backend = "openai"
model = "text-embedding-3-small"
profile = "openai_text_embedding_3_small_v1"

[routes.eval-6x.search_queries]
backend = "openai"
