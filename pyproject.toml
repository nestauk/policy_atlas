[project]
name = "policy-atlas"
version = "0.1.0"
description = "Policy Atlas v3.0 backend"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic>=1.14",
    "structlog>=24",
    "python-dotenv>=1.2.2",
    # <1: the 1.x line hard-depends on pymupdf-layout/onnxruntime — the ML stack the
    # approved dependency gate excludes (contract decision 5; that tier is the docling seam)
    # >=0.3.4: the determinism source-patch in ingest_full_text targets 0.3.4's
    # column_boxes source; older floors would let a lock regen land on unpatched code
    "pymupdf4llm>=0.3.4,<1",
    "trafilatura>=1.12",
    # Task 009 (approved gated change 2): embeddings + structured generation, one SDK
    "openai>=1.60",
    # Task 009: trace backbone — env-driven, no-op without LANGFUSE_* keys
    "langfuse>=3",
]

[project.scripts]
policy-atlas-skeleton = "policy_atlas.skeleton:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-psycopg2",
]
