[project]
name = "policy-atlas"
version = "0.1.0"
description = "Policy Atlas v3.0 backend"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic>=1.14",
    "structlog>=24",
]

[project.scripts]
policy-atlas-skeleton = "policy_atlas.skeleton:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-psycopg2",
    "python-dotenv>=1.2.2",
]
