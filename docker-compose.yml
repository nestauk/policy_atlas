services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: policy_atlas
      POSTGRES_PASSWORD: policy_atlas
      POSTGRES_DB: policy_atlas
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy_atlas"]
      interval: 2s
      timeout: 5s
      retries: 15
