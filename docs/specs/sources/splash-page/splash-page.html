  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script>\n(function(){\n// Fold-mark geometry: one square sheet whose corners fold to the centre.\n// Shared by the design-site pages so the header mark matches the product.\n\nconst H = 75;\nconst MID = [[-H, 0], [0, -H], [H, 0], [0, H]];\nconst CORNERS = ['TL', 'TR', 'BR', 'BL'];\nconst OUTER = { TL: [-H, -H], TR: [H, -H], BR: [H, H], BL: [-H, H] };\nconst ALL = ['TL', 'TR', 'BR', 'BL'];\n\nconst BLUE = '#0000F5', SAND = '#ECC77F', TEAL = '#6FBFA7', SALMON = '#F09B80', PINK = '#E8B9C8';\n\nconst FRAMES = [\n  [[], 0, SAND], [['TL'], 0, SAND], [['TL', 'TR'], 0, SAND], [['TL', 'TR', 'BL'], 0, SAND],\n  [ALL, 0, BLUE], [ALL, 45, BLUE],\n  [['TL', 'BR', 'BL'], 45, TEAL], [['BL', 'BR'], 45, TEAL], [['BR'], 45, TEAL], [[], 45, TEAL],\n  [['TR'], 45, TEAL], [['TL', 'TR'], 45, TEAL], [['TL', 'TR', 'BR'], 45, TEAL],\n  [ALL, 45, BLUE], [ALL, 0, BLUE],\n  [['TL', 'TR', 'BR'], 0, SALMON], [['TR', 'BR'], 0, SALMON], [['BR'], 0, SALMON], [[], 0, SALMON],\n  [['TL'], 0, SALMON], [['TL', 'BL'], 0, SALMON], [['TL', 'TR', 'BL'], 0, SALMON],\n  [ALL, 0, BLUE], [ALL, 45, BLUE],\n  [['TL', 'BR', 'BL'], 45, PINK], [['BL', 'BR'], 45, PINK], [['BR'], 45, PINK], [[], 45, PINK],\n  [['TR'], 45, PINK], [['TL', 'TR'], 45, PINK], [['TL', 'TR', 'BR'], 45, PINK],\n  [ALL, 45, BLUE], [ALL, 0, BLUE],\n  [['TL', 'TR', 'BR'], 0, SAND], [['TR', 'BR'], 0, SAND], [['BR'], 0, SAND]\n];\n\nconst has = (set, c) => set.indexOf(c) > -1;\n\nfunction prune(pts) {\n  return pts.filter((p, i) => {\n    const a = pts[(i + pts.length - 1) % pts.length], c = pts[(i + 1) % pts.length];\n    return Math.abs((p[0] - a[0]) * (c[1] - p[1]) - (p[1] - a[1]) * (c[0] - p[0])) > 1e-9;\n  });\n}\n\nfunction silhouette(folded) {\n  const pts = [];\n  CORNERS.forEach((c, i) => { pts.push(MID[i]); if (!has(folded, c)) pts.push(OUTER[c]); });\n  return prune(pts);\n}\n\nfunction flaps(folded) {\n  if (!folded.length) return null;\n  if (folded.length === 4) return MID.slice();\n  const idx = CORNERS.map((c, i) => has(folded, c) ? i : -1).filter((i) => i > -1);\n  const start = idx.find((i) => idx.indexOf((i + 3) % 4) === -1);\n  const out = [[0, 0]];\n  for (let k = 0; k <= folded.length; k++) out.push(MID[(start + k) % 4]);\n  return out;\n}\n\nfunction toPath(pts, deg) {\n  const r = deg * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r);\n  const p = pts.map(([x, y]) => [x * cs - y * sn, x * sn + y * cs].map((n) => Math.round(n * 100) / 100));\n  return 'M' + p[0].join(' ') + p.slice(1).map((q) => 'L' + q.join(' ')).join('') + 'Z';\n}\n\n// Paths for one frame index, optionally with an explicit rotation.\n// `reverse` is the colour of the sheet's folded reverse: #0000F5 on light\n// surfaces, #FFFFFF on dark ones.\nfunction framePaths(n, deg, reverse) {\n  const rev = reverse || BLUE;\n  const [folded, baseDeg, colour] = FRAMES[n];\n  const rot = deg === undefined ? baseDeg : deg;\n  const out = [];\n  if (folded.length < 4) out.push({ fill: colour === BLUE ? rev : colour, d: toPath(silhouette(folded), rot) });\n  const f = flaps(folded);\n  if (f) out.push({ fill: rev, d: toPath(f, rot) });\n  return out;\n}\n\n// The square's four lines of symmetry, crossing at the fold point. The set\n// {0, 45, 90, 135} is unchanged by a 45-degree turn, so one overlay serves the\n// square frames and the diamond ones alike.\nfunction axisLines() {\n  const R = 106, Q = +(R / Math.SQRT2).toFixed(2), PERIOD = 13;\n  const offset = +(((3.5 - R % PERIOD) % PERIOD + PERIOD) % PERIOD).toFixed(2);\n  const lines = [[-R, 0, R, 0], [0, -R, 0, R], [-Q, -Q, Q, Q], [-Q, Q, Q, -Q]];\n  return lines.map(([x1, y1, x2, y2]) => ({ x1, y1, x2, y2, dash: '7 6', offset }));\n}\n\nconst FPS = 5.6, ROTATE_MS = 714;\nconst shut = (n) => FRAMES[n][0].length === 4;\nconst isTurn = (n) => shut(n) && shut((n + 1) % FRAMES.length);\nconst ease = (t) => t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 e-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  body { margin:0; background:#0F294A; -webkit-font-smoothing:antialiased; }\n  a { color:#B6E3E8; }\n  a:hover { color:#fff; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#0F294A;font-family:'Mulish',system-ui,sans-serif;color:#fff\">\n\n  <header style=\"display:flex;justify-content:center;border-bottom:1px solid rgba(255,255,255,.16);background:#0F294A;padding:0 24px\">\n    <div style=\"width:100%;max-width:1180px;display:flex;height:64px;align-items:center;justify-content:space-between;gap:24px\">\n      <div style=\"display:flex;min-width:0;align-items:center;gap:7px\">\n        <svg aria-hidden=\"true\" width=\"26\" height=\"26\" sc-camel-view-box=\"-115 -115 230 230\" style=\"flex-shrink:0;display:block;overflow:visible\">\n          <g data-fold-rot=\"fold\"><sc-for list=\"{{ foldPaths }}\" as=\"fp\" hint-placeholder-count=\"0\"><path d=\"{{ fp.d }}\" fill=\"{{ fp.fill }}\"><\u002Fpath><\u002Fsc-for><\u002Fg>\n        <\u002Fsvg>\n        <span style=\"white-space:nowrap;font-family:'Archivo',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;color:#fff\">Policy <b style=\"color:#B6E3E8\">Atlas<\u002Fb><\u002Fspan>\n      <\u002Fdiv>\n      <a href=\"#access\" style=\"flex-shrink:0;font-size:16px;font-weight:800;line-height:20px;color:#fff;text-decoration:none\" style-hover=\"color:#B6E3E8\">Request access<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"position:relative;min-height:calc(100vh - 64px);overflow:hidden;background:#0F294A;display:flex;justify-content:center;align-items:center;padding:80px 24px\">\n\n    <div id=\"splash-field\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none\">\n      <sc-for list=\"{{ sheets }}\" as=\"s\" hint-placeholder-count=\"10\">\n        <svg sc-camel-view-box=\"-115 -115 230 230\" style=\"position:absolute;left:{{ s.x }};top:{{ s.y }};width:{{ s.size }};height:{{ s.size }};transform:translate(-50%, -50%);opacity:{{ s.opacity }};overflow:visible\">\n          <g data-fold-rot=\"{{ s.key }}\"><sc-for list=\"{{ s.paths }}\" as=\"fp\" hint-placeholder-count=\"0\"><path d=\"{{ fp.d }}\" fill=\"{{ fp.fill }}\"><\u002Fpath><\u002Fsc-for><\u002Fg>\n        <\u002Fsvg>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showCopy }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:relative;z-index:1;width:100%;max-width:1180px\">\n      <div id=\"splash-copy\" style=\"max-width:20em\">\n        <h1 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:clamp(40px, 5.4vw, 68px);font-weight:800;line-height:1.02;letter-spacing:-.025em;color:#fff;text-wrap:pretty\">Create policy plans you can trust<\u002Fh1>\n        <p style=\"margin:24px 0 0;max-width:26em;font-size:21px;line-height:31px;color:#c8d6e6;text-wrap:pretty\">Use AI and trusted research to find and test policy ideas<\u002Fp>\n        <div style=\"margin-top:36px;display:flex;flex-wrap:wrap;gap:14px\">\n          <a href=\"#access\" style=\"display:inline-flex;align-items:center;min-height:48px;background:#fff;padding:0 22px;font-size:19px;font-weight:800;line-height:24px;white-space:nowrap;color:#0F294A;text-decoration:none;clip-path:polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 0 100%)\" style-hover=\"background:#B6E3E8;color:#0F294A\">Request access<\u002Fa>\n          <a href=\"#access\" style=\"display:inline-flex;align-items:center;min-height:48px;border:1px solid rgba(255,255,255,.4);padding:0 22px;font-size:19px;font-weight:800;line-height:24px;white-space:nowrap;color:#fff;text-decoration:none\" style-hover=\"border-color:#B6E3E8;color:#B6E3E8\">Sign in<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fsection>\n\n  <section style=\"display:flex;justify-content:center;border-top:1px solid rgba(255,255,255,.16);padding:0 24px\">\n    <div style=\"width:100%;max-width:1180px;display:flex;flex-direction:column\">\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center;padding:88px 0\">\n        <div>\n          <div style=\"font-size:16px;font-weight:800;line-height:20px;color:#B6E3E8\">01<\u002Fdiv>\n          <h2 style=\"margin:12px 0 0;max-width:18em;font-family:'Archivo',sans-serif;font-size:clamp(28px, 3vw, 40px);font-weight:800;line-height:1.1;letter-spacing:-.02em;color:#fff;text-wrap:pretty\">Quickly become an expert in a new topic<\u002Fh2>\n          <p style=\"margin:18px 0 0;max-width:30em;font-size:19px;line-height:29px;color:#c8d6e6;text-wrap:pretty\">Ask a question in plain language. Atlas plans the search, runs it, and comes back with a structured brief you can read in ten minutes.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;min-height:280px;border:1px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.04);font-size:16px;line-height:20px;color:rgba(255,255,255,.5)\">Screenshot: report view<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center;border-top:1px solid rgba(255,255,255,.16);padding:88px 0\">\n        <div style=\"display:flex;align-items:center;justify-content:center;min-height:280px;border:1px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.04);font-size:16px;line-height:20px;color:rgba(255,255,255,.5)\">Screenshot: shared workspace<\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;font-weight:800;line-height:20px;color:#B6E3E8\">02<\u002Fdiv>\n          <h2 style=\"margin:12px 0 0;max-width:18em;font-family:'Archivo',sans-serif;font-size:clamp(28px, 3vw, 40px);font-weight:800;line-height:1.1;letter-spacing:-.02em;color:#fff;text-wrap:pretty\">Collaborate on policy ideas<\u002Fh2>\n          <p style=\"margin:18px 0 0;max-width:30em;font-size:19px;line-height:29px;color:#c8d6e6;text-wrap:pretty\">Searches, plans and findings live in a shared space. Colleagues can pick up a run, question a source, and add what they know.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center;border-top:1px solid rgba(255,255,255,.16);padding:88px 0\">\n        <div>\n          <div style=\"font-size:16px;font-weight:800;line-height:20px;color:#B6E3E8\">03<\u002Fdiv>\n          <h2 style=\"margin:12px 0 0;max-width:18em;font-family:'Archivo',sans-serif;font-size:clamp(28px, 3vw, 40px);font-weight:800;line-height:1.1;letter-spacing:-.02em;color:#fff;text-wrap:pretty\">Only uses trusted sources for evidence<\u002Fh2>\n          <p style=\"margin:18px 0 0;max-width:30em;font-size:19px;line-height:29px;color:#c8d6e6;text-wrap:pretty\">A named set of evidence libraries, journals and government publications. Every claim carries the citation it came from.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;min-height:280px;border:1px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.04);font-size:16px;line-height:20px;color:rgba(255,255,255,.5)\">Screenshot: sources panel<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center;border-top:1px solid rgba(255,255,255,.16);padding:88px 0\">\n        <div style=\"display:flex;align-items:center;justify-content:center;min-height:280px;border:1px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.04);font-size:16px;line-height:20px;color:rgba(255,255,255,.5)\">Screenshot: plan approval<\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;font-weight:800;line-height:20px;color:#B6E3E8\">04<\u002Fdiv>\n          <h2 style=\"margin:12px 0 0;max-width:18em;font-family:'Archivo',sans-serif;font-size:clamp(28px, 3vw, 40px);font-weight:800;line-height:1.1;letter-spacing:-.02em;color:#fff;text-wrap:pretty\">Control AI-powered search and analysis<\u002Fh2>\n          <p style=\"margin:18px 0 0;max-width:30em;font-size:19px;line-height:29px;color:#c8d6e6;text-wrap:pretty\">You see the plan before it runs, edit any step, and watch the work as it happens. Nothing is decided out of sight.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center;border-top:1px solid rgba(255,255,255,.16);padding:88px 0\">\n        <div>\n          <div style=\"font-size:16px;font-weight:800;line-height:20px;color:#B6E3E8\">05<\u002Fdiv>\n          <h2 style=\"margin:12px 0 0;max-width:18em;font-family:'Archivo',sans-serif;font-size:clamp(28px, 3vw, 40px);font-weight:800;line-height:1.1;letter-spacing:-.02em;color:#fff;text-wrap:pretty\">Find evidence translatable to your domain<\u002Fh2>\n          <p style=\"margin:18px 0 0;max-width:30em;font-size:19px;line-height:29px;color:#c8d6e6;text-wrap:pretty\">Tell Atlas the setting you work in. Findings from adjacent fields and other countries come back with a note on how far they carry.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;min-height:280px;border:1px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.04);font-size:16px;line-height:20px;color:rgba(255,255,255,.5)\">Screenshot: transferability note<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center;border-top:1px solid rgba(255,255,255,.16);padding:88px 0\">\n        <div style=\"display:flex;align-items:center;justify-content:center;min-height:280px;border:1px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.04);font-size:16px;line-height:20px;color:rgba(255,255,255,.5)\">Screenshot: options compared<\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;font-weight:800;line-height:20px;color:#B6E3E8\">06<\u002Fdiv>\n          <h2 style=\"margin:12px 0 0;max-width:18em;font-family:'Archivo',sans-serif;font-size:clamp(28px, 3vw, 40px);font-weight:800;line-height:1.1;letter-spacing:-.02em;color:#fff;text-wrap:pretty\">Broaden the ideas to form and implement policy<\u002Fh2>\n          <p style=\"margin:18px 0 0;max-width:30em;font-size:19px;line-height:29px;color:#c8d6e6;text-wrap:pretty\">Move from what the evidence says to what you could do: options, trade-offs and the conditions each one depends on.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"access\" style=\"display:flex;justify-content:center;border-top:1px solid rgba(255,255,255,.16);background:#fff;padding:0 24px 96px\">\n    <div style=\"width:100%;max-width:1180px;padding-top:72px\">\n      <div style=\"font-size:16px;font-weight:800;line-height:20px;color:#646363\">Trusted by<\u002Fdiv>\n      <div style=\"margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px\">\n        <div style=\"display:flex;align-items:center;justify-content:center;min-height:112px;padding:20px 22px\">\n          <img src=\"4178552c-26d7-42f6-bed1-de6b382d92cd\" alt=\"Department for Digital, Culture, Media &amp; Sport\" style=\"display:block;max-width:100%;max-height:72px;width:auto;height:auto;object-fit:contain\">\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;min-height:112px;padding:20px 22px\">\n          <img src=\"4fcdef35-0849-4b0d-98eb-3e6ea91fba6d\" alt=\"Department of Health &amp; Social Care\" style=\"display:block;max-width:100%;max-height:72px;width:auto;height:auto;object-fit:contain\">\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;min-height:112px;padding:20px 22px\">\n          <img src=\"d4ec2c04-45ad-4ec1-a3cc-f3877ec9778d\" alt=\"Australian Government\" style=\"display:block;max-width:100%;max-height:72px;width:auto;height:auto;object-fit:contain\">\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;min-height:112px;padding:20px 22px\">\n          <img src=\"9e05ceba-d39e-447e-8f0b-dc99b4443129\" alt=\"Department for Energy Security &amp; Net Zero\" style=\"display:block;max-width:100%;max-height:72px;width:auto;height:auto;object-fit:contain\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;sheetScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:1.8,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Constellation&quot;},&quot;minGap&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;min&quot;:0,&quot;max&quot;:80,&quot;step&quot;:4,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Constellation&quot;},&quot;spread&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Constellation&quot;},&quot;showCopy&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Constellation&quot;},&quot;foldSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.4,&quot;min&quot;:0.1,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Fold animation&quot;},&quot;sheetPalette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Pastel&quot;,&quot;options&quot;:[&quot;Pastel&quot;,&quot;Cool&quot;,&quot;Mono&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Fold animation&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    foldClock: 0,\n    vw: typeof window === 'undefined' ? 1440 : window.innerWidth,\n    vh: typeof window === 'undefined' ? 900 : window.innerHeight\n  };\n\n  // Keep only sheets that clear every sheet already placed, measured in real\n  // pixels — the field then never overlaps at any viewport size.\n  placed() {\n    const box = this._fieldBox;\n    const vw = box ? box.w : this.state.vw;\n    const vh = box ? box.h : Math.max(320, this.state.vh - 64);\n    const scale = this.props.sheetScale ?? 1;\n    const gap = this.props.minGap ?? 12;\n    const out = [];\n    this.layout().forEach((s, i) => {\n      const size = s.size * scale;\n      const r = size * 0.46;\n      const cx = parseFloat(s.x) / 100 * vw;\n      const cy = parseFloat(s.y) / 100 * vh;\n      const clear = out.every((o) => Math.hypot(cx - o.cx, cy - o.cy) >= r + o.r + gap);\n      if (clear && !this.hitsCopy(cx, cy, r + gap)) out.push({ ...s, i, cx, cy, r, px: size });\n    });\n    return out;\n  }\n\n  // Hand-placed so the field stays composed and clear of the copy column.\n  layout() {\n    return [\n      { x: '78%', y: '17%', size: 250, opacity: 1,   off: 0.0 },\n      { x: '93%', y: '54%', size: 150, opacity: 0.5, off: 2.3 },\n      { x: '69%', y: '80%', size: 310, opacity: 1,   off: 4.7 },\n      { x: '58%', y: '38%', size: 110, opacity: 0.3, off: 1.4 },\n      { x: '30%', y: '11%', size: 66,  opacity: 0.5, off: 3.6 },\n      { x: '8%',  y: '9%',  size: 104, opacity: 1,   off: 5.9 },\n      { x: '20%', y: '89%', size: 158, opacity: 1,   off: 7.1 },\n      { x: '46%', y: '93%', size: 80,  opacity: 0.3, off: 8.2 },\n      { x: '88%', y: '90%', size: 72,  opacity: 0.5, off: 6.4 },\n      { x: '4%',  y: '77%', size: 58,  opacity: 0.3, off: 9.5 },\n      { x: '62%', y: '4%',  size: 96,  opacity: 0.5, off: 11.2 },\n      { x: '97%', y: '31%', size: 62,  opacity: 0.3, off: 12.8 },\n      { x: '83%', y: '68%', size: 54,  opacity: 0.3, off: 10.4 },\n      { x: '52%', y: '62%', size: 132, opacity: 0.5, off: 13.7 },\n      { x: '35%', y: '99%', size: 190, opacity: 1,   off: 15.1 },\n      { x: '2%',  y: '38%', size: 68,  opacity: 0.3, off: 14.3 },\n      { x: '15%', y: '58%', size: 46,  opacity: 0.3, off: 16.6 },\n      { x: '73%', y: '46%', size: 74,  opacity: 0.5, off: 17.9 },\n      { x: '44%', y: '20%', size: 52,  opacity: 0.3, off: 18.4 },\n      { x: '92%', y: '8%',  size: 118, opacity: 1,   off: 19.7 },\n      { x: '26%', y: '31%', size: 44,  opacity: 0.3, off: 20.6 },\n      { x: '66%', y: '25%', size: 58,  opacity: 0.5, off: 21.9 },\n      { x: '38%', y: '52%', size: 88,  opacity: 0.5, off: 23.2 },\n      { x: '86%', y: '38%', size: 48,  opacity: 0.3, off: 24.5 },\n      { x: '58%', y: '74%', size: 66,  opacity: 0.5, off: 25.8 },\n      { x: '10%', y: '24%', size: 40,  opacity: 0.3, off: 27.1 },\n      { x: '76%', y: '58%', size: 42,  opacity: 0.3, off: 28.4 },\n      { x: '48%', y: '8%',  size: 70,  opacity: 0.5, off: 29.7 },\n      { x: '30%', y: '70%', size: 56,  opacity: 0.3, off: 31.0 },\n      { x: '95%', y: '73%', size: 92,  opacity: 1,   off: 32.3 },\n      { x: '6%',  y: '96%', size: 64,  opacity: 0.5, off: 33.6 },\n      { x: '68%', y: '10%', size: 38,  opacity: 0.3, off: 34.9 }\n    ];\n  }\n\n  // Sheets must also clear the copy block, measured from the live DOM.\n  hitsCopy(cx, cy, r) {\n    if (!(this.props.showCopy ?? true)) return false;\n    const box = this._copyBox;\n    if (!box) return false;\n    const nx = Math.max(box.left, Math.min(cx, box.right));\n    const ny = Math.max(box.top, Math.min(cy, box.bottom));\n    return Math.hypot(cx - nx, cy - ny) < r;\n  }\n\n  measureCopy() {\n    const el = document.getElementById('splash-copy');\n    const field = document.getElementById('splash-field');\n    if (!el || !field) return false;\n    const o = field.getBoundingClientRect();\n    const f = this._fieldBox;\n    let moved = false;\n    if (!f || f.w !== o.width || f.h !== o.height) { this._fieldBox = { w: o.width, h: o.height }; moved = true; }\n    const b = el.getBoundingClientRect();\n    const box = { left: b.left - o.left, right: b.right - o.left, top: b.top - o.top, bottom: b.bottom - o.top };\n    const p = this._copyBox;\n    if (p && p.left === box.left && p.right === box.right && p.top === box.top && p.bottom === box.bottom) return moved;\n    this._copyBox = box;\n    return true;\n  }\n\n  componentDidMount() {\n    this._onResize = () => {\n      const vw = window.innerWidth, vh = window.innerHeight;\n      if (vw !== this.state.vw || vh !== this.state.vh) this.setState({ vw, vh });\n    };\n    window.addEventListener('resize', this._onResize);\n    this._onResize();\n    // Placement must not depend on the animation loop: a hidden or throttled\n    // page never runs rAF, and the first paint would otherwise be unmeasured.\n    const remeasure = () => { if (this.measureCopy()) this.forceUpdate(); };\n    remeasure();\n    requestAnimationFrame(remeasure);\n    setTimeout(remeasure, 120);\n    this._onResize = ((prev) => () => { prev(); remeasure(); })(this._onResize);\n    window.addEventListener('resize', this._onResize);\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(remeasure);\n    const myGen = (window.__splashGen2 = (window.__splashGen2 || 0) + 1);\n    const tick = () => {\n      if (window.__splashGen2 !== myGen) return;\n      const now = performance.now() / 1000 * (this.props.foldSpeed ?? 0.4);\n      this.paintFolds(now);\n      // Re-render as soon as ANY sheet crosses a frame boundary, not just one.\n      const spread = this.props.spread ?? 1;\n      if (this.measureCopy()) this.forceUpdate();\n      const sig = this.placed().map((s) => { this.foldPathsFor(now + s.off * spread, true); return this._lastFoldFrame; }).join(',');\n      if (sig !== this._sig) {\n        this._sig = sig;\n        this._nodes = null;\n        this.setState({ foldClock: now });\n      }\n      requestAnimationFrame(tick);\n    };\n    requestAnimationFrame(tick);\n  }\n\n  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }\n\n  paintFolds(now) {\n    let gs = this._nodes;\n    if (!gs || !gs.length || !gs[0].isConnected) gs = this._nodes = [...document.querySelectorAll('[data-fold-rot]')];\n    const cache = {};\n    gs.forEach((g) => {\n      const k = g.getAttribute('data-fold-rot');\n      if (cache[k] === undefined) {\n        const off = k === 'fold' ? 0 : parseFloat(k.slice(1)) || 0;\n        cache[k] = 'rotate(' + this.foldDegFor(now + off).toFixed(2) + ')';\n      }\n      if (g.getAttribute('transform') !== cache[k]) g.setAttribute('transform', cache[k]);\n    });\n  }\n\n  sheetColours() {\n    const pal = this.props.sheetPalette ?? 'Pastel';\n    if (pal === 'Cool') return ['#B6E3E8', '#8FD3DC', '#B6E3E8', '#8FD3DC'];\n    if (pal === 'Mono') return ['#ffffff', '#c8d6e6', '#ffffff', '#c8d6e6'];\n    return ['#ECC77F', '#6FBFA7', '#F09B80', '#E8B9C8'];\n  }\n\n  foldFrames() {\n    const key = this.props.sheetPalette ?? 'Pastel';\n    if (this._foldF && this._foldKey === key) return this._foldF;\n    this._foldKey = key;\n    const [A, B, C, D] = this.sheetColours();\n    const SHUT = '#ffffff';\n    const ALL = ['TL', 'TR', 'BR', 'BL'];\n    this._foldF = [\n      [['TL'], 0, A], [['TL','TR'], 0, A], [['TL','TR','BL'], 0, A],\n      [ALL, 0, SHUT], [ALL, 45, SHUT],\n      [['TL','BR','BL'], 45, B], [['BL','BR'], 45, B], [['BR'], 45, B], [[], 45, B],\n      [['TR'], 45, B], [['TL','TR'], 45, B], [['TL','TR','BR'], 45, B],\n      [ALL, 45, SHUT], [ALL, 0, SHUT],\n      [['TL','TR','BR'], 0, C], [['TR','BR'], 0, C], [['BR'], 0, C], [[], 0, C],\n      [['TL'], 0, C], [['TL','BL'], 0, C], [['TL','TR','BL'], 0, C],\n      [ALL, 0, SHUT], [ALL, 45, SHUT],\n      [['TL','BR','BL'], 45, D], [['BL','BR'], 45, D], [['BR'], 45, D], [[], 45, D],\n      [['TR'], 45, D], [['TL','TR'], 45, D], [['TL','TR','BR'], 45, D],\n      [ALL, 45, SHUT], [ALL, 0, SHUT],\n      [['TL','TR','BR'], 0, A], [['TR','BR'], 0, A], [['BR'], 0, A], [[], 0, A]\n    ];\n    return this._foldF;\n  }\n\n  foldPathsFor(pos, noRot) {\n    const FLAP = '#ffffff', H = 75;\n    const MID = [[-H,0],[0,-H],[H,0],[0,H]];\n    const CORNERS = ['TL','TR','BR','BL'];\n    const OUTER = { TL:[-H,-H], TR:[H,-H], BR:[H,H], BL:[-H,H] };\n    const F = this.foldFrames();\n    const has = (set, c) => set.indexOf(c) > -1;\n    const prune = (pts) => pts.filter((p, i) => {\n      const a = pts[(i + pts.length - 1) % pts.length], c = pts[(i + 1) % pts.length];\n      return Math.abs((p[0]-a[0])*(c[1]-p[1]) - (p[1]-a[1])*(c[0]-p[0])) > 1e-9;\n    });\n    const silhouette = (folded) => {\n      const pts = [];\n      CORNERS.forEach((c, i) => { pts.push(MID[i]); if (!has(folded, c)) pts.push(OUTER[c]); });\n      return prune(pts);\n    };\n    const flaps = (folded) => {\n      if (!folded.length) return null;\n      if (folded.length === 4) return MID.slice();\n      const idx = CORNERS.map((c, i) => has(folded, c) ? i : -1).filter((i) => i > -1);\n      const start = idx.find((i) => idx.indexOf((i + 3) % 4) === -1);\n      const out = [[0, 0]];\n      for (let k = 0; k <= folded.length; k++) out.push(MID[(start + k) % 4]);\n      return out;\n    };\n    const d = (pts, deg) => {\n      const r = deg * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r);\n      const p = pts.map(([x, y]) => [x*cs - y*sn, x*sn + y*cs].map((n) => Math.round(n*100)/100));\n      return 'M' + p[0].join(' ') + p.slice(1).map((q) => 'L' + q.join(' ')).join('') + 'Z';\n    };\n    const shut = (n) => F[n][0].length === 4;\n    const isTurn = (n) => shut(n) && shut((n + 1) % F.length);\n    const fps = 5.6, ROTATE_MS = 714;\n    const turnBeats = 1 + ROTATE_MS / 1000 * fps, hold = 1 / turnBeats;\n    const durs = F.map((f, k) => isTurn(k) ? turnBeats : 1);\n    const starts = []; let total = 0;\n    durs.forEach((du) => { starts.push(total); total += du; });\n    const p = ((pos * fps) % total + total) % total;\n    let n = F.length - 1;\n    while (n > 0 && starts[n] > p) n--;\n    const t = (p - starts[n]) / durs[n];\n    const ease = (x) => x < 0.5 ? 2*x*x : 1 - 2*(1-x)*(1-x);\n    let deg = F[n][1];\n    if (isTurn(n)) deg += 45 * ease(Math.max(0, (t - hold) / (1 - hold)));\n    const [folded, , colour] = F[n];\n    this._lastFoldFrame = n;\n    if (noRot) { this._degOut = deg; deg = 0; }\n    const out = [];\n    if (folded.length < 4) out.push({ d: d(silhouette(folded), deg), fill: colour });\n    const fl = flaps(folded);\n    if (fl) out.push({ d: d(fl, deg), fill: FLAP });\n    return out;\n  }\n\n  foldDegFor(pos) { this.foldPathsFor(pos, true); return this._degOut || 0; }\n\n  renderVals() {\n    const clock = this.state.foldClock;\n    const spread = this.props.spread ?? 1;\n    const pal = this.sheetColours();\n    return {\n      foldPaths: this.foldPathsFor(clock, true),\n      showCopy: this.props.showCopy ?? true,\n      sheets: this.placed().map((s) => {\n        const off = s.off * spread;\n        const i = s.i;\n        return {\n          x: s.x,\n          y: s.y,\n          size: Math.round(s.px) + 'px',\n          opacity: s.opacity,\n          key: 'o' + off.toFixed(3),\n          paths: this.foldPathsFor(clock + off, true).map((p) => ({\n            d: p.d,\n            fill: p.fill === '#ffffff' ? '#ffffff' : pal[(pal.indexOf(p.fill) + i) % pal.length]\n          }))\n        };\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
